figure:
  dpi: 200
  image_format: png
  title_size: 18
  subtitle_size: 14
  axis_label_size: 12
  tick_size: 10
  annotation_size: 7

heatmap:
  cmap: RdBu
  nan_color: "#f2f2f2"
  color_limit: 30
  colorbar_ticks: [-30, -20, -10, 0, 10, 20, 30]
  cell_format: "{:.1f}"

lineplot:
  linewidth: 2.0
  markersize: 3.0
  grid: true

violin:
  width: 0.8
  show_box: true
  show_mean: true
  show_median: true
  show_count: true
  show_std: false
  ylabel: RMSE
