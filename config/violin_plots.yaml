plots:
  - name: global_conus_temperature500_rmse
    title: "Forecast RMSE Guidance: All Days"
    subtitle: "500-hPa Temperature RMSE Distribution"
    metric: rmse
    variable: temperature
    level: 500
    lead_hours: [24, 240]
    regions: [global, conus]
    models:
      - nested_eagle_global
      - gfs
      - aigfs
    output: violin_global_conus_temperature500_rmse.png

  - name: global_conus_2m_temperature_rmse
    title: "Forecast RMSE Guidance: All Days"
    subtitle: "2-m Temperature RMSE Distribution"
    metric: rmse
    variable: 2m_temperature
    level: null
    lead_hours: [24, 240]
    regions: [global, conus]
    models:
      - nested_eagle_global
      - gfs
      - aigfs
    output: violin_global_conus_2m_temperature_rmse.png
